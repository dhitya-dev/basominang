<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BasoMinang</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link rel="stylesheet" href="../static/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1><b>BasoMinang</b></h1>
      <p>
        BasoMinang memudahkan penerjemahan bahasa Indonesia dan Minangkabau
        dengan fitur Text-to-Speech.
      </p>

      <div class="language-selector">
        <span id="lang1">Indonesia</span>
        <img
          src="{{ url_for('static', filename='Change Icon.svg') }}"
          alt="Change Language"
          onclick="swapLanguages()"
        />
        <span id="lang2">Minangkabau</span>
      </div>

      <div class="translation-box">
        <div class="box">
          <div class="box-header">
            <h4 id="label1">Indonesia</h4>
            <img
              src="{{ url_for('static', filename='Close Icon.svg') }}"
              alt="Close"
              onclick="clearText('text1')"
            />
          </div>
          <textarea
            id="text1"
            data-lang="indo"
            placeholder="Masukkan teks di sini..."
          ></textarea>
          <div class="icons">
            <img
              src="{{ url_for('static', filename='Copy Icon.svg') }}"
              alt="Copy"
              onclick="copyText('text1')"
            />
            <img
              src="{{ url_for('static', filename='Sound Icon.svg') }}"
              alt="Sound"
              onclick="playAudio('text1')"
            />
          </div>
        </div>
        <div class="box">
          <div class="box-header">
            <h4 id="label2">Minangkabau</h4>
            <img
              src="{{ url_for('static', filename='Close Icon.svg') }}"
              alt="Close"
              onclick="clearText('text2')"
            />
          </div>
          <textarea id="text2" data-lang="minang" readonly></textarea>
          <div class="icons">
            <img
              src="{{ url_for('static', filename='Copy Icon.svg') }}"
              alt="Copy"
              onclick="copyText('text2')"
            />
            <img
              src="{{ url_for('static', filename='Sound Icon.svg') }}"
              alt="Sound"
              onclick="playAudio('text2')"
            />
          </div>
        </div>
      </div>

      <button onclick="translateText()" class="button-translate">
        Terjemahkan
      </button>

      <audio id="audioPlayer" style="display: none">
        <source id="audioSource" type="audio/wav" />
        Browser Anda tidak mendukung elemen audio.
      </audio>
    </div>

    <script>
      function clearText(id) {
        document.getElementById(id).value = "";
      }

      function copyText(id) {
        const textArea = document.getElementById(id);
        textArea.select();
        document.execCommand("copy");
      }

      function translateText() {
        let inputText = document.getElementById("text1").value;
        let lang1 = document.getElementById("lang1").innerText;
        let langMode = lang1 === "Indonesia" ? "indo_minang" : "minang_indo";

        fetch("/translate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ text: inputText, lang: langMode }),
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("text2").value = data.translated_text;
          })
          .catch((error) => console.error("Error:", error));
      }

      function swapLanguages() {
        let lang1 = document.getElementById("lang1").innerText;
        let lang2 = document.getElementById("lang2").innerText;
        document.getElementById("lang1").innerText = lang2;
        document.getElementById("lang2").innerText = lang1;

        let label1 = document.getElementById("label1").innerText;
        let label2 = document.getElementById("label2").innerText;
        document.getElementById("label1").innerText = label2;
        document.getElementById("label2").innerText = label1;

        let text1 = document.getElementById("text1").value;
        let text2 = document.getElementById("text2").value;
        document.getElementById("text1").value = text2;
        document.getElementById("text2").value = text1;

        // 🔹 Perbarui `data-lang` agar bahasa TTS sesuai dengan swap terbaru
        document
          .getElementById("text1")
          .setAttribute(
            "data-lang",
            lang2 === "Minangkabau" ? "minang" : "indo",
          );
        document
          .getElementById("text2")
          .setAttribute("data-lang", lang1 === "Indonesia" ? "indo" : "minang");
      }

      function playAudio(textareaId) {
        let text = document.getElementById(textareaId).value;
        if (!text) {
          alert("Tidak ada teks untuk diucapkan!");
          return;
        }

        // 🔹 Ambil bahasa dari `data-lang` di textarea
        let lang = document
          .getElementById(textareaId)
          .getAttribute("data-lang");

        fetch("/speak", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, lang: lang }),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.audio_url) {
              let audio = document.getElementById("audioPlayer");
              let source = document.getElementById("audioSource");
              source.src = data.audio_url + "?t=" + new Date().getTime(); // Hindari cache
              audio.style.display = "block";
              audio.load();
              audio.play();
            } else {
              alert("Gagal menghasilkan audio!");
            }
          })
          .catch((error) => console.error("Error:", error));
      }
    </script>
  </body>
</html>
